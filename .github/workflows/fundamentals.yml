name: fundamentals
on:
  workflow_dispatch:
  push:
    branches: [round36-factors]
    paths: ["research/fundamentals/fetch_fundamentals.py", ".github/workflows/fundamentals.yml"]
concurrency:
  group: fundamentals
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quarterly statements (missing files only, most liquid first, one page every 2.5 s)
        run: python research/fundamentals/fetch_fundamentals.py | tail -5 || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fundamentals
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Round 36 data: quarterly statements [skip ci]"
          git pull -q --rebase origin ${{ github.ref_name }}
          git push -q
