name: fundamentals
on:
  workflow_dispatch:
  push:
    branches: [round36-factors]
    paths: ["research/fundamentals/fetch_fundamentals.py", "research/prices_tickers.txt", ".github/workflows/fundamentals.yml"]
concurrency:
  group: fundamentals
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh research prices (Yahoo)
        continue-on-error: true
        run: python research/fetch_research_prices.py
      - name: Fetch quarterly statements (biznesradar)
        continue-on-error: true
        run: python research/fundamentals/fetch_fundamentals.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/prices research/prices_foreign research/fundamentals
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Round 36: prices and quarterly statements [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
