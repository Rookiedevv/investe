name: fundamentals
# Quarterly statements from biznesradar for the factor ranking (research round 36).
# Twice a month: income statement + balance sheet of the 70 most liquid stocks, one page every 4 seconds
# (the site stops answering after a few hundred quick requests). Parsed CSVs are committed back.
on:
  workflow_dispatch:
  schedule:
    - cron: "10 3 12,26 * *"
concurrency:
  group: fundamentals
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch income statement and balance sheet (70 most liquid, forced refresh)
        env:
          FETCH_DELAY: "4"
          FETCH_BUDGET: "1800"
        run: python research/fundamentals/fetch_fundamentals.py --top 70 --pages rzis,bilans --force | tail -5 || true
      - name: Parse to CSV
        run: python research/fundamentals/parse_fundamentals.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fundamentals
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Update quarterly statements [skip ci]"
          git pull -q --rebase origin ${{ github.ref_name }}
          git push -q
