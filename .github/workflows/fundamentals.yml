name: fundamentals
on:
  workflow_dispatch:
  push:
    branches: [round36-factors]
    paths: ["research/fundamentals/fetch_fundamentals.py", ".github/workflows/fundamentals.yml"]
concurrency:
  group: fundamentals
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quarterly statements (missing files only, most liquid first, one page every 2.5 s), saving every 10 minutes
        env:
          FETCH_BUDGET: "600"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for pass in 1 2 3 4 5; do
            python research/fundamentals/fetch_fundamentals.py | tail -3 || true
            git add research/fundamentals
            if git diff --cached --quiet; then echo "nothing new"; break; fi
            git commit -q -m "Round 36 data: quarterly statements, pass $pass [skip ci]"
            git pull -q --rebase origin ${{ github.ref_name }}
            git push -q
            if tail -3 research/fundamentals/raw/_fetch_log.txt | grep -q "not answering"; then break; fi
          done
