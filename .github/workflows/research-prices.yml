name: research-prices
on:
  workflow_dispatch:
  schedule:
    # Evenings of the 25th-31st, after the Warsaw close: fresh closes for the month-end
    # factor ranking (research round 36). 16:50 UTC = 17:50 Warsaw in winter, 18:50 in summer (the monthly check runs at 19:47).
    - cron: "50 16 25-31 * *"
  push:
    branches: [main]
    paths: ["research/prices_tickers.txt", "research/foreign_tickers.txt", "research/fetch_research_prices.py"]
concurrency:
  group: research-prices
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/fetch_research_prices.py
      - name: Commit research price files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/prices research/prices_foreign
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Update research price files [skip ci]"
            git pull --rebase origin main
            git push
          fi
