name: research-prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/prices_tickers.txt", "research/fetch_research_prices.py"]
concurrency:
  group: research-prices
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/fetch_research_prices.py
      - name: Commit research price files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/prices
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Update research price files [skip ci]"
            git pull --rebase origin main
            git push
          fi
