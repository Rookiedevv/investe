name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/fetch_prices.py /tmp/prices.csv
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan snapshot; git rm -rqf .; cp /tmp/prices.csv prices.csv
          git add prices.csv; git commit -qm "Price snapshot"; git push -f origin snapshot
